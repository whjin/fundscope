# ==============================================
# 基金持仓系统 - Nginx 完整配置（HTTP + HTTPS）
# 适用场景：生产环境、带 SSL 证书
# 文件位置：/etc/nginx/conf.d/fundscope.conf
# 证书路径：/etc/letsencrypt/live/fundscope.wuhuajin.com/
# ==============================================

# WebSocket Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP 80 ----------
server {
    listen 80;
    server_name fundscope.wuhuajin.com;

    access_log /var/log/nginx/fundscope.access.log;
    error_log  /var/log/nginx/fundscope.error.log;

    # Let's Encrypt webroot 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # 其余请求跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS 443 ----------
server {
    listen 443 ssl http2;
    server_name fundscope.wuhuajin.com;

    # SSL 证书配置
    ssl_certificate     /etc/letsencrypt/live/fundscope.wuhuajin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fundscope.wuhuajin.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 日志
    access_log /var/log/nginx/fundscope.access.log;
    error_log  /var/log/nginx/fundscope.error.log;

    # 根路径反向代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;

        # WebSocket 支持
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 静态资源缓存（可选，如 Node.js 直接处理则不需要）
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_cache_valid 200 7d;
    #     expires 7d;
    # }
}
