# ============================================================
# FundScope - 基金持仓分析平台 Nginx 配置（子域名方案）
# 架构: Nginx(公网80/443) → 内网Node.js(127.0.0.1:3000)
# 访问: https://fundscope.wuhuajin.com/
#
# 说明: wuhuajin.com 主域仍指向 GitHub Pages（whjin.github.io）
#       fundscope 项目通过子域名 fundscope.wuhuajin.com 独立访问
#       两边互不干扰，无需路径前缀，Express 路由保持简洁
# ============================================================

# WebSocket Connection 头映射
# 普通HTTP请求使用 close，仅WebSocket请求使用 upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ============================================================
# 80端口：Let's Encrypt证书验证 + 全局跳转HTTPS
# ============================================================
server {
    listen 80;
    server_name fundscope.wuhuajin.com;

    access_log /var/log/nginx/fundscope.access.log;
    error_log  /var/log/nginx/fundscope.error.log;

    # Let's Encrypt webroot 证书验证目录（必须保留，否则续期报错）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # 其余请求全部301跳转HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# 443端口HTTPS：根路径反向代理（无需子路径前缀）
# ============================================================
server {
    listen 443 ssl http2;
    server_name fundscope.wuhuajin.com;

    # SSL 证书（通过 certbot webroot 申请）
    ssl_certificate     /etc/letsencrypt/live/fundscope.wuhuajin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fundscope.wuhuajin.com/privkey.pem;

    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    access_log /var/log/nginx/fundscope.access.log;
    error_log  /var/log/nginx/fundscope.error.log;

    # ============================================================
    # 核心反向代理规则：根路径代理
    # 注意：proxy_pass 不带尾部斜杠，原样转发请求路径
    #   https://fundscope.wuhuajin.com/api/funds/config
    #   → http://127.0.0.1:3000/api/funds/config
    #   https://fundscope.wuhuajin.com/js/app.js
    #   → http://127.0.0.1:3000/js/app.js
    #   https://fundscope.wuhuajin.com/
    #   → http://127.0.0.1:3000/ (Express catch-all 返回 index.html)
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 传递客户端真实信息、HTTPS协议标识
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 接口超时适配基金数据拉取
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲区设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;

        # WebSocket支持（仅当客户端发起Upgrade时生效）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
